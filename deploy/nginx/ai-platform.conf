# Production Nginx for https://aihub.xzsmart.top
# New API remains on 127.0.0.1:3000. Do not enable HSTS until HTTPS is stable.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ai_platform_newapi {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name aihub.xzsmart.top;

    client_max_body_size 32m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aihub.xzsmart.top;

    ssl_certificate     /etc/letsencrypt/live/aihub.xzsmart.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aihub.xzsmart.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 32m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self'" always;
    # Enable after HTTPS is confirmed stable:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /logo.png {
        alias /opt/ai-platform/data/branding/logo.png;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://ai_platform_newapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
